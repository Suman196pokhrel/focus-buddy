[package]
name = "focus-buddy"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A local webcam focus reminder for Linux"

[dependencies]
anyhow = "1"
dirs = "6"
gtk = { package = "gtk4", version = "0.10", features = ["v4_10"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0
